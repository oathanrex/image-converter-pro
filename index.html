            "@type": "Question",
            "name": "Is Image Converter Pro free to use?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The tool is free with no account sign-up, no watermarks, and no daily conversion cap."
            }
          },
          {
            "@type": "Question",
            "name": "Are my images uploaded to a server?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Every conversion, resize, color adjustment, ZIP archive, and PDF merge runs locally inside your browser using the HTML5 Canvas and File APIs. Your files stay on your device."
            }
          },
          {
            "@type": "Question",
            "name": "Which image formats are supported?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You can open JPG, PNG, WEBP, GIF, BMP, and SVG files. Exports support JPG, PNG, WEBP, static GIF, BMP, and single or merged PDF documents. Animated GIFs export their first frame, and SVG vectors are rasterized."
            }
          },
          {
            "@type": "Question",
            "name": "Can I convert and rename multiple images at once?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Drop a batch of images, set an optional filename prefix or suffix in the queue header, convert everything together, and download individual files, a single ZIP archive, or a combined multi-page PDF."
            }
          },
          {
            "@type": "Question",
            "name": "Does conversion keep or remove EXIF metadata?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "EXIF metadata is stripped by default to protect privacy by removing camera serial numbers, timestamps, and GPS coordinates. When exporting to JPG, PNG, or WEBP, you can turn on Preserve EXIF metadata in the settings panel to retain it."
            }
          },
          {
            "@type": "Question",
            "name": "What are the file size and dimension limits?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Each file can be up to 50 MB, up to 50 megapixels total, and up to 10,000 pixels on any side so your browser tab stays responsive during processing."
            }
          },
          {
            "@type": "Question",
            "name": "How do I convert JPG to PNG or WEBP?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Drop your JPG files onto the workspace, select PNG or WEBP under Output Format, adjust quality or dimensions if needed, and click Convert All. You can inspect the before-and-after comparison slider before downloading."
            }
          }
